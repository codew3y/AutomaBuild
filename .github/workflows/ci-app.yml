# The seam: the four components composed into one running system.
#
# This is the only job that proves the parts fit. Each component's own workflow
# proves the component; none of them can prove the join, which is where the
# interesting failures were.
name: app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: the four components, joined
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # One install, at the root, for the whole workspace.
      #
      # It used to be a deliberately lockfile-free `npm install`, because the
      # components came from their default branches and this job existed to
      # catch one of them breaking the join. They are workspace packages now:
      # there is no upstream to drift, the join is whatever is in this commit,
      # and the lockfile is committed like anywhere else.
      - run: npm ci
        working-directory: .

      # The editor is served from disk by the server under test, so it has to
      # exist before the demo runs.
      - run: npm run build --workspace automa-flow-canvas
        working-directory: .

      - run: npm run typecheck
      - run: npm test

      - run: docker compose up -d --build

      # `if` rather than assigning the result of a command substitution: the
      # step runs under `bash -e`, where a failing substitution aborts the
      # script, so a database that is merely not ready yet ends the job on the
      # first attempt instead of being waited for.
      - name: wait for the mail server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/info >/dev/null; then
              echo ready
              exit 0
            fi
            sleep 1
          done
          echo "mailpit did not come up"
          docker compose logs mailpit --tail 20
          exit 1

      # `pg_isready` is not enough here, and the failure it allows is rare
      # enough to look like bad luck: `read ECONNRESET` from the migration, on
      # a job that passed on the previous commit.
      #
      # The official Postgres image's entrypoint starts a *temporary* server to
      # run initdb and any init scripts, then shuts it down and starts the real
      # one. `pg_isready` answers yes against that temporary server, the loop
      # exits, and the next step connects into the restart window.
      #
      # So: a real query rather than a readiness ping, and three consecutive
      # successes a second apart, which no restart window survives.
      - name: wait for both databases
        run: |
          streak=0
          for _ in $(seq 1 90); do
            if docker compose exec -T runner-db psql -U automa -d automa -c 'select 1' >/dev/null 2>&1                && docker compose exec -T gate-db psql -U webhookgate -d webhookgate -c 'select 1' >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then
                echo ready
                exit 0
              fi
            else
              streak=0
            fi
            sleep 1
          done
          echo "the databases did not come up"
          docker compose logs --tail 40
          exit 1

      - run: npm run db:migrate
        env:
          WEBHOOK_SECRETS: whsec_ci_secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: AutomaBuild <flows@automabuild.test>
          # Nothing may leave the runner even if the host were misconfigured.
          # .test is reserved by RFC 2606 and can never be a real domain.
          SMTP_ALLOWED_RECIPIENTS: "@example.test"

      # The demo is the deliverable, so it runs here rather than being a thing
      # that worked once on somebody's laptop. It fails the build if a forgery
      # is accepted, a duplicate starts a second run, or a mapped reference
      # does not resolve.
      - run: npm run demo
        env:
          WEBHOOK_SECRETS: whsec_ci_secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: AutomaBuild <flows@automabuild.test>
          # Nothing may leave the runner even if the host were misconfigured.
          # .test is reserved by RFC 2606 and can never be a real domain.
          SMTP_ALLOWED_RECIPIENTS: "@example.test"

      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 100
