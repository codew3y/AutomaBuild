name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: the four components, joined
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No lockfile commit: the three components are installed from their
      # default branches on purpose, so this build is what catches a change in
      # one of them breaking the join. That is the entire reason this workflow
      # exists — a green component repository proves nothing about the seam.
      - run: npm install

      - run: npm run typecheck
      - run: npm test

      - run: docker compose up -d --build

      # `if` rather than assigning the result of a command substitution: the
      # step runs under `bash -e`, where a failing substitution aborts the
      # script, so a database that is merely not ready yet ends the job on the
      # first attempt instead of being waited for.
      - name: wait for the mail server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/info >/dev/null; then
              echo ready
              exit 0
            fi
            sleep 1
          done
          echo "mailpit did not come up"
          docker compose logs mailpit --tail 20
          exit 1

      - name: wait for both databases
        run: |
          for _ in $(seq 1 90); do
            if docker compose exec -T runner-db pg_isready -U automa -d automa >/dev/null 2>&1                && docker compose exec -T gate-db pg_isready -U webhookgate -d webhookgate >/dev/null 2>&1; then
              echo ready
              exit 0
            fi
            sleep 1
          done
          echo "the databases did not come up"
          docker compose logs --tail 40
          exit 1

      - run: npm run db:migrate
        env:
          WEBHOOK_SECRETS: whsec_ci_secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: AutomaBuild <flows@automabuild.test>
          # Nothing may leave the runner even if the host were misconfigured.
          # .test is reserved by RFC 2606 and can never be a real domain.
          SMTP_ALLOWED_RECIPIENTS: "@example.test"

      # The demo is the deliverable, so it runs here rather than being a thing
      # that worked once on somebody's laptop. It fails the build if a forgery
      # is accepted, a duplicate starts a second run, or a mapped reference
      # does not resolve.
      - run: npm run demo
        env:
          WEBHOOK_SECRETS: whsec_ci_secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: AutomaBuild <flows@automabuild.test>
          # Nothing may leave the runner even if the host were misconfigured.
          # .test is reserved by RFC 2606 and can never be a real domain.
          SMTP_ALLOWED_RECIPIENTS: "@example.test"

      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 100
