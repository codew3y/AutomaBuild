# Publishes to npm with provenance, on a pushed tag.
#
# Provenance requires `id-token: write` and npm >= 9.5. It links the published
# tarball back to this workflow run and this commit, so an installer can verify
# where the code came from — which matters rather a lot for a security library.
#
# Requires an NPM_TOKEN secret with publish rights (automation token).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before anything is published if the tag and the manifest disagree.
      # Tagging v0.2.0 against version 0.1.0 would otherwise quietly republish
      # 0.1.0, and npm unpublishing is a 72-hour window at best.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Publishing version ${PKG}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
