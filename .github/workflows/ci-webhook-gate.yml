# webhook-gate
#
# Relocated from automa-webhook-gate's own repository when the five were merged into one.
# The job body is unchanged apart from three things, because the Postgres
# services and the skip-detection here were worth keeping exactly as they were:
#
#   - `defaults.run.working-directory` puts every step in the package, so the
#     scripts, the compose files and the relative paths all still resolve.
#   - the install step overrides that back to the repository root, because in a
#     workspace there is one install and one lockfile and they live there.
#   - a `paths` filter, so a change to the editor does not rerun the engine's
#     database matrix. Five suites on every push to one repository is how a
#     green tick stops being read.
name: webhook-gate

on:
  push:
    branches: [main]
    paths:
      - packages/automa-webhook-gate/**
      - package-lock.json
      - .github/workflows/ci-webhook-gate.yml
  pull_request:
    branches: [main]
    paths:
      - packages/automa-webhook-gate/**
      - package-lock.json
      - .github/workflows/ci-webhook-gate.yml

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/automa-webhook-gate
    strategy:
      fail-fast: false
      matrix:
        # The suite runs TypeScript directly, which needs Node's type
        # stripping (unflagged from 22.18 and 23.6).
        node: ['22.18', '24']

    services:
      # A stock image is enough here — this project needs one ordinary table,
      # no extensions. That is itself worth noticing: the replay store is
      # deliberately unpartitioned, so there is nothing to configure.
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: webhookgate
          POSTGRES_USER: webhookgate
          POSTGRES_PASSWORD: webhookgate
        ports: ['54331:5432']
        options: >-
          --health-cmd "pg_isready -U webhookgate -d webhookgate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # One install, at the root, for the whole workspace.
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test

  # The database tests skip themselves when nothing is listening, which is what
  # keeps the pure suite runnable with no infrastructure. That is also exactly
  # how a whole class of tests goes quietly missing, so this job asserts the
  # count: if the Postgres suite ever silently stops running, the build fails
  # rather than staying green with less coverage than it claims.
  no-silent-skips:
    name: database tests actually ran
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/automa-webhook-gate
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: webhookgate
          POSTGRES_USER: webhookgate
          POSTGRES_PASSWORD: webhookgate
        ports: ['54331:5432']
        options: >-
          --health-cmd "pg_isready -U webhookgate -d webhookgate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # One install, at the root, for the whole workspace.
      - run: npm ci
        working-directory: .
      - run: npm run db:migrate
      - name: run the suite and assert nothing was skipped
        run: |
          npm test 2>&1 | tee test-output.txt
          skipped=$(grep -oP '^# skipped \K[0-9]+' test-output.txt || echo 0)
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) skipped — the database suite did not run"
            exit 1
          fi
          echo "no tests skipped"
