# safe-fetch
#
# Relocated from automa-safe-fetch's own repository when the five were merged into one.
# The job body is unchanged apart from three things, because the Postgres
# services and the skip-detection here were worth keeping exactly as they were:
#
#   - `defaults.run.working-directory` puts every step in the package, so the
#     scripts, the compose files and the relative paths all still resolve.
#   - the install step overrides that back to the repository root, because in a
#     workspace there is one install and one lockfile and they live there.
#   - a `paths` filter, so a change to the editor does not rerun the engine's
#     database matrix. Five suites on every push to one repository is how a
#     green tick stops being read.
name: safe-fetch

on:
  push:
    branches: [main]
    paths:
      - packages/automa-safe-fetch/**
      - package-lock.json
      - .github/workflows/ci-safe-fetch.yml
  pull_request:
    branches: [main]
    paths:
      - packages/automa-safe-fetch/**
      - package-lock.json
      - .github/workflows/ci-safe-fetch.yml

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/automa-safe-fetch
    strategy:
      fail-fast: false
      matrix:
        # The suite runs TypeScript directly, which needs Node's type
        # stripping (unflagged from 22.18 and 23.6).
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # One install, at the root, for the whole workspace.
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The package ships compiled JavaScript, so it must work on the oldest
  # runtime `engines` claims — not just on the version the tests run under.
  verify-published-artifact:
    name: built package on node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/automa-safe-fetch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # One install, at the root, for the whole workspace.
      - run: npm ci
        working-directory: .
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: import dist and block a known-bad URL
        run: |
          node --input-type=module -e "
            import { createSafeFetch, SsrfBlockedError } from './dist/index.js'
            import assert from 'node:assert/strict'
            const safeFetch = createSafeFetch()
            await assert.rejects(
              () => safeFetch('http://169.254.169.254/latest/meta-data/'),
              SsrfBlockedError,
            )
            await assert.rejects(() => safeFetch('http://0x7f000001/'), SsrfBlockedError)
            console.log('dist works on node ' + process.version)
          "
